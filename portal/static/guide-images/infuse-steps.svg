<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc"><title id="title">Infuse 连接影视服的操作路线图</title><desc id="desc">通用步骤示意，不是软件截图。添加 Emby，填写用户中心给出的播放线路和账号，再保存试播。</desc><rect width="1000" height="880" rx="24" fill="#101012"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="60" y="62" font-size="23" fill="#d8b66c" letter-spacing="5">MediaDock / CLIENT GUIDE</text><text x="60" y="126" font-size="46" font-weight="600" fill="#f4efe5">Infuse · 连接路线图</text><circle cx="92" cy="205" r="25" fill="#d8b66c"/><text x="92" y="215" fill="#151515" text-anchor="middle" font-size="29">1</text><text x="147" y="217" fill="#eee9df" font-size="37">找到添加媒体服务器</text><path d="M92 236v46" stroke="#6d5a35" stroke-width="2"/><circle cx="92" cy="321" r="25" fill="#d8b66c"/><text x="92" y="331" fill="#151515" text-anchor="middle" font-size="29">2</text><text x="147" y="333" fill="#eee9df" font-size="37">选择 Emby</text><path d="M92 352v46" stroke="#6d5a35" stroke-width="2"/><circle cx="92" cy="437" r="25" fill="#d8b66c"/><text x="92" y="447" fill="#151515" text-anchor="middle" font-size="29">3</text><text x="147" y="449" fill="#eee9df" font-size="37">填写播放线路与账号</text><path d="M92 468v46" stroke="#6d5a35" stroke-width="2"/><circle cx="92" cy="553" r="25" fill="#d8b66c"/><text x="92" y="563" fill="#151515" text-anchor="middle" font-size="29">4</text><text x="147" y="565" fill="#eee9df" font-size="37">保存后打开片库</text><path d="M60 646H940" stroke="#6d5a35"/><text x="60" y="707" font-size="29" fill="#d8b66c">手机 / Mac：设置 → 添加文件 → 媒体服务器</text><text x="60" y="756" font-size="28" fill="#c6c1b8">Apple TV：设置 → 共享 → 添加媒体服务器</text><text x="60" y="826" font-size="24" fill="#8d887f">步骤示意 · 非软件截图 · 具体入口名称以当前版本为准</text></g></svg>