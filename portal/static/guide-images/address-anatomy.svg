<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc">
<title id="title">连接地址拆分示意</title>
<desc id="desc">示例 https://media.example.com:8443 可拆分为 HTTPS 协议、media.example.com 主机和 8443 端口。单独域名栏不带协议和端口。通用示意，非软件截图，示例不可连接。</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; } .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }</style>
<rect width="1000" height="1100" fill="#0b0b0c"/>
<text x="64" y="74" font-size="24" fill="#d8b66c" font-weight="600" letter-spacing="3">MediaDock / 影视服</text>
<text x="936" y="74" font-size="24" fill="#d8b66c" font-weight="500" text-anchor="end">01 / 03</text>
<text x="64" y="145" font-size="48" fill="#eeeeee" font-weight="650" >先看懂你的连接地址</text>
<text x="64" y="192" font-size="26" fill="#bcb8af" font-weight="400" >同一条地址，在不同播放器里可能要分开填写。</text>
<rect x="64" y="235" width="872" height="142" rx="20" fill="#181714" stroke="#776444" stroke-width="2"/><text x="96" y="277" font-size="24" fill="#bcb8af" font-weight="400" >示例完整地址</text><text x="96" y="337" font-size="37" font-weight="600" class="mono"><tspan fill="#d8b66c">https://</tspan><tspan fill="#eeeeee">media.example.com</tspan><tspan fill="#d8b66c">:8443</tspan></text><rect x="64" y="429" width="872" height="154" rx="20" fill="#141416" stroke="#34302a" stroke-width="2"/><text x="96" y="476" font-size="25" fill="#d8b66c" font-weight="600" >01</text><text x="151" y="476" font-size="28" fill="#bcb8af" font-weight="500" >协议</text><text x="904" y="478" font-size="32" fill="#eeeeee" font-weight="600" text-anchor="end">HTTPS</text><path d="M96 501H904" fill="none" stroke="#34302a" stroke-width="2"/><text x="96" y="548" font-size="28" fill="#eeeeee" font-weight="400" >HTTPS 开关：开启</text><rect x="64" y="611" width="872" height="154" rx="20" fill="#141416" stroke="#34302a" stroke-width="2"/><text x="96" y="658" font-size="25" fill="#d8b66c" font-weight="600" >02</text><text x="151" y="658" font-size="28" fill="#bcb8af" font-weight="500" >主机 / 域名</text><text x="904" y="660" font-size="32" fill="#eeeeee" font-weight="600" text-anchor="end">media.example.com</text><path d="M96 683H904" fill="none" stroke="#34302a" stroke-width="2"/><text x="96" y="730" font-size="28" fill="#eeeeee" font-weight="400" >单独域名栏：不带 https://，不带端口</text><rect x="64" y="793" width="872" height="154" rx="20" fill="#141416" stroke="#34302a" stroke-width="2"/><text x="96" y="840" font-size="25" fill="#d8b66c" font-weight="600" >03</text><text x="151" y="840" font-size="28" fill="#bcb8af" font-weight="500" >端口</text><text x="904" y="842" font-size="32" fill="#eeeeee" font-weight="600" text-anchor="end">8443</text><path d="M96 865H904" fill="none" stroke="#34302a" stroke-width="2"/><text x="96" y="912" font-size="28" fill="#eeeeee" font-weight="400" >按地址中冒号后的数字填写</text>
<path d="M64 1008H936" fill="none" stroke="#34302a" stroke-width="2"/>
<text x="64" y="1057" font-size="23" fill="#a5a197" font-weight="400" >通用示意 · 非软件截图</text>
<text x="936" y="1057" font-size="23" fill="#a5a197" font-weight="400" text-anchor="end">示例地址不可连接</text>
</svg>