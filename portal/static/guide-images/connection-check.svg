<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc">
<title id="title">端口和输入格式检查示意</title>
<desc id="desc">HTTPS 地址无显式端口时为 443，HTTP 无显式端口时为 80，明确指定端口如 8443 则照填。不要因 Emby 改成 8096 或 8920。完整地址框填写完整 URL，分栏表单拆分填写。通用示意，非软件截图。</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; } .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }</style>
<rect width="1000" height="1100" fill="#0b0b0c"/>
<text x="64" y="74" font-size="24" fill="#d8b66c" font-weight="600" letter-spacing="3">MediaDock / 影视服</text>
<text x="936" y="74" font-size="24" fill="#d8b66c" font-weight="500" text-anchor="end">03 / 03</text>
<text x="64" y="145" font-size="48" fill="#eeeeee" font-weight="650" >保存前，核对这两件事</text>
<text x="64" y="192" font-size="26" fill="#bcb8af" font-weight="400" >以卖家提供的实际地址为准。</text>
<text x="64" y="253" font-size="32" fill="#d8b66c" font-weight="600" >端口跟着地址走</text><rect x="64" y="282" width="872" height="94" rx="20" fill="#141416" stroke="#34302a" stroke-width="2"/><text x="96" y="341" font-size="32" fill="#eeeeee" font-weight="650" >HTTPS</text><text x="285" y="340" font-size="28" fill="#bcb8af" font-weight="400" >地址没有写端口</text><text x="900" y="343" font-size="38" fill="#d8b66c" font-weight="650" text-anchor="end">443</text><rect x="64" y="394" width="872" height="94" rx="20" fill="#141416" stroke="#34302a" stroke-width="2"/><text x="96" y="453" font-size="32" fill="#eeeeee" font-weight="650" >HTTP</text><text x="285" y="452" font-size="28" fill="#bcb8af" font-weight="400" >地址没有写端口</text><text x="900" y="455" font-size="38" fill="#d8b66c" font-weight="650" text-anchor="end">80</text><rect x="64" y="506" width="872" height="94" rx="20" fill="#141416" stroke="#34302a" stroke-width="2"/><text x="96" y="565" font-size="32" fill="#eeeeee" font-weight="650" >:8443</text><text x="285" y="564" font-size="28" fill="#bcb8af" font-weight="400" >地址明确写了端口</text><text x="900" y="567" font-size="38" fill="#d8b66c" font-weight="650" text-anchor="end">8443</text><text x="64" y="653" font-size="29" fill="#e8d5ab" font-weight="500" >不要因选择 Emby 就改成 8096 / 8920。</text><text x="64" y="713" font-size="32" fill="#d8b66c" font-weight="600" >再看播放器给你的输入框</text><rect x="64" y="741" width="872" height="101" rx="20" fill="#141416" stroke="#34302a" stroke-width="2"/><text x="96" y="781" font-size="27" fill="#bcb8af" font-weight="400" >一个完整地址框</text><text x="96" y="821" font-size="29" fill="#eeeeee" font-weight="500" >填写完整 URL（含 http:// 或 https://）</text><rect x="64" y="863" width="872" height="101" rx="20" fill="#141416" stroke="#34302a" stroke-width="2"/><text x="96" y="903" font-size="27" fill="#bcb8af" font-weight="400" >主机 + HTTPS + 端口分栏</text><text x="96" y="943" font-size="29" fill="#eeeeee" font-weight="500" >拆开填写；主机栏只放域名或 IP</text>
<path d="M64 1008H936" fill="none" stroke="#34302a" stroke-width="2"/>
<text x="64" y="1057" font-size="23" fill="#a5a197" font-weight="400" >通用示意 · 非软件截图</text>
<text x="936" y="1057" font-size="23" fill="#a5a197" font-weight="400" text-anchor="end">示例地址不可连接</text>
</svg>