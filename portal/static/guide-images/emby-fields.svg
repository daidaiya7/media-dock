<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc">
<title id="title">Emby 添加服务器通用表单示意</title>
<desc id="desc">服务类型 Emby，名称影视服，主机 media.example.com，HTTPS 开启，端口 8443，用户名为你的播放账号，密码隐藏。域名栏不带 https://。通用示意，非软件截图，示例不可连接。</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; } .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }</style>
<rect width="1000" height="1100" fill="#0b0b0c"/>
<text x="64" y="74" font-size="24" fill="#d8b66c" font-weight="600" letter-spacing="3">MediaDock / 影视服</text>
<text x="936" y="74" font-size="24" fill="#d8b66c" font-weight="500" text-anchor="end">02 / 03</text>
<text x="64" y="145" font-size="48" fill="#eeeeee" font-weight="650" >分栏表单，逐项对应</text>
<text x="64" y="192" font-size="26" fill="#bcb8af" font-weight="400" >以下字段仅演示填写方式，以播放器界面为准。</text>
<rect x="64" y="227" width="872" height="638" rx="20" fill="#141416" stroke="#34302a" stroke-width="2"/><text x="96" y="279" font-size="28" fill="#bcb8af" font-weight="400" >服务类型</text><text x="374" y="279" font-size="32" fill="#eeeeee" font-weight="550" >Emby</text><path d="M96 307H904" fill="none" stroke="#34302a" stroke-width="2"/><text x="96" y="361" font-size="28" fill="#bcb8af" font-weight="400" >名称</text><text x="374" y="361" font-size="32" fill="#eeeeee" font-weight="550" >影视服</text><path d="M96 389H904" fill="none" stroke="#34302a" stroke-width="2"/><text x="96" y="443" font-size="28" fill="#bcb8af" font-weight="400" >主机 / 域名</text><text x="374" y="443" font-size="32" fill="#eeeeee" font-weight="550" >media.example.com</text><path d="M96 471H904" fill="none" stroke="#34302a" stroke-width="2"/><text x="96" y="525" font-size="28" fill="#bcb8af" font-weight="400" >HTTPS</text><text x="374" y="525" font-size="32" fill="#eeeeee" font-weight="550" >开启</text><rect x="801" y="496" width="87" height="41" rx="21" fill="#d8b66c" stroke="#d8b66c" stroke-width="2"/><circle cx="867" cy="517" r="16" fill="#0b0b0c"/><path d="M96 553H904" fill="none" stroke="#34302a" stroke-width="2"/><text x="96" y="607" font-size="28" fill="#bcb8af" font-weight="400" >端口</text><text x="374" y="607" font-size="32" fill="#eeeeee" font-weight="550" >8443</text><path d="M96 635H904" fill="none" stroke="#34302a" stroke-width="2"/><text x="96" y="689" font-size="28" fill="#bcb8af" font-weight="400" >用户名</text><text x="374" y="689" font-size="32" fill="#eeeeee" font-weight="550" >你的播放账号</text><path d="M96 717H904" fill="none" stroke="#34302a" stroke-width="2"/><text x="96" y="771" font-size="28" fill="#bcb8af" font-weight="400" >密码</text><text x="374" y="771" font-size="32" fill="#eeeeee" font-weight="550" >● ● ● ● ● ● ● ●</text><rect x="64" y="894" width="872" height="83" rx="20" fill="#211d15" stroke="#6d5936" stroke-width="2"/><text x="96" y="946" font-size="29" fill="#e8d5ab" font-weight="500" >域名栏不带 https://；账号使用播放账号。</text>
<path d="M64 1008H936" fill="none" stroke="#34302a" stroke-width="2"/>
<text x="64" y="1057" font-size="23" fill="#a5a197" font-weight="400" >通用示意 · 非软件截图</text>
<text x="936" y="1057" font-size="23" fill="#a5a197" font-weight="400" text-anchor="end">示例地址不可连接</text>
</svg>